<svg viewBox="0 0 860 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <rect width="860" height="780" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#202124">A) INMP441 mikrofon → ESP32-S3 (stalna veza, žice &lt; 10 cm)</text>

  <!-- ESP32-S3 box (A) -->
  <rect x="80" y="70" width="220" height="240" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="190" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">ESP32-S3 N32R16V</text>
  <text x="285" y="114" font-size="12" text-anchor="end" fill="#d93025" font-weight="bold">3V3 ●</text>
  <text x="285" y="144" font-size="12" text-anchor="end" fill="#444444" font-weight="bold">GND ●</text>
  <text x="285" y="184" font-size="12" text-anchor="end" fill="#1a73e8" font-weight="bold">GPIO 4 ●</text>
  <text x="285" y="214" font-size="12" text-anchor="end" fill="#1a73e8" font-weight="bold">GPIO 5 ●</text>
  <text x="285" y="244" font-size="12" text-anchor="end" fill="#188038" font-weight="bold">GPIO 6 ●</text>
  <text x="95" y="295" font-size="11" fill="#d93025">GPIO 35/36/37 = PSRAM — NE!</text>

  <!-- INMP441 box (A) -->
  <rect x="560" y="70" width="210" height="240" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="665" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">INMP441</text>
  <text x="575" y="114" font-size="12" fill="#d93025" font-weight="bold">● VDD</text>
  <text x="575" y="144" font-size="12" fill="#444444" font-weight="bold">● GND</text>
  <text x="575" y="184" font-size="12" fill="#1a73e8" font-weight="bold">● SCK (BCLK)</text>
  <text x="575" y="214" font-size="12" fill="#1a73e8" font-weight="bold">● WS (LRCL)</text>
  <text x="575" y="244" font-size="12" fill="#188038" font-weight="bold">● SD (DOUT)</text>
  <text x="575" y="274" font-size="12" fill="#e37400" font-weight="bold">● L/R</text>

  <!-- wires A -->
  <line x1="300" y1="110" x2="560" y2="110" stroke="#d93025" stroke-width="2.5"/>
  <line x1="300" y1="140" x2="560" y2="140" stroke="#444444" stroke-width="2.5"/>
  <line x1="300" y1="180" x2="560" y2="180" stroke="#1a73e8" stroke-width="2.5"/>
  <line x1="300" y1="210" x2="560" y2="210" stroke="#1a73e8" stroke-width="2.5"/>
  <line x1="300" y1="240" x2="560" y2="240" stroke="#188038" stroke-width="2.5"/>
  <!-- decoupling cap between 3V3 and GND wires -->
  <line x1="470" y1="110" x2="470" y2="120" stroke="#d93025" stroke-width="2"/>
  <line x1="462" y1="120" x2="478" y2="120" stroke="#202124" stroke-width="2.5"/>
  <line x1="462" y1="126" x2="478" y2="126" stroke="#202124" stroke-width="2.5"/>
  <line x1="470" y1="126" x2="470" y2="140" stroke="#444444" stroke-width="2"/>
  <text x="486" y="127" font-size="11" fill="#202124">100 nF + 10 µF (uz mikrofon!)</text>
  <!-- L/R to GND -->
  <line x1="560" y1="270" x2="520" y2="270" stroke="#e37400" stroke-width="2.5"/>
  <line x1="520" y1="270" x2="520" y2="292" stroke="#e37400" stroke-width="2.5"/>
  <line x1="508" y1="292" x2="532" y2="292" stroke="#444444" stroke-width="3"/>
  <line x1="512" y1="298" x2="528" y2="298" stroke="#444444" stroke-width="2.5"/>
  <line x1="516" y1="304" x2="524" y2="304" stroke="#444444" stroke-width="2"/>
  <text x="420" y="285" font-size="11" fill="#e37400">L/R na GND = lijevi kanal</text>
  <!-- signal direction labels -->
  <text x="430" y="174" font-size="11" text-anchor="middle" fill="#1a73e8">clock →</text>
  <text x="430" y="234" font-size="11" text-anchor="middle" fill="#188038">← podaci</text>

  <!-- ================= PANEL B ================= -->
  <text x="30" y="378" font-size="17" font-weight="bold" fill="#202124">B) INA226 mjerenje potrošnje (samo za E5) — shunt U SERIJI sa napajanjem</text>

  <!-- source box -->
  <rect x="40" y="440" width="150" height="100" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="2"/>
  <text x="115" y="465" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">3.3 V izvor</text>
  <text x="115" y="482" font-size="10" text-anchor="middle" fill="#5f6368">(lab. napajanje /</text>
  <text x="115" y="495" font-size="10" text-anchor="middle" fill="#5f6368">baterija + regulator)</text>
  <text x="182" y="514" font-size="13" text-anchor="end" fill="#d93025" font-weight="bold">+ ●</text>
  <text x="182" y="536" font-size="13" text-anchor="end" fill="#444444" font-weight="bold">− ●</text>

  <!-- INA226 box -->
  <rect x="300" y="420" width="190" height="210" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="395" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">INA226</text>
  <text x="315" y="514" font-size="12" fill="#d93025" font-weight="bold">● IN+</text>
  <text x="475" y="514" font-size="12" text-anchor="end" fill="#d93025" font-weight="bold">IN− ●</text>
  <text x="340" y="536" font-size="10" text-anchor="start" fill="#5f6368">(interni shunt)</text>
  <text x="315" y="570" font-size="12" fill="#d93025">● VCC → 3V3 (S3)</text>
  <text x="475" y="592" font-size="12" text-anchor="end" fill="#9334e6" font-weight="bold">SDA ●</text>
  <text x="475" y="614" font-size="12" text-anchor="end" fill="#9334e6" font-weight="bold">SCL ●</text>
  <text x="315" y="614" font-size="11" fill="#5f6368">adresa 0x40</text>

  <!-- ESP32-S3 box (B) -->
  <rect x="620" y="420" width="200" height="210" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="720" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">ESP32-S3</text>
  <text x="635" y="514" font-size="12" fill="#d93025" font-weight="bold">● 3V3 (napaja ploču)</text>
  <text x="635" y="592" font-size="12" fill="#9334e6" font-weight="bold">● GPIO 8</text>
  <text x="635" y="614" font-size="12" fill="#9334e6" font-weight="bold">● GPIO 9</text>
  <text x="635" y="560" font-size="11" fill="#d93025">USB OTKAČEN tokom</text>
  <text x="635" y="574" font-size="11" fill="#d93025">mjerenja!</text>

  <!-- shunt path -->
  <line x1="190" y1="510" x2="300" y2="510" stroke="#d93025" stroke-width="3"/>
  <line x1="490" y1="510" x2="620" y2="510" stroke="#d93025" stroke-width="3"/>
  <text x="245" y="502" font-size="11" text-anchor="middle" fill="#d93025">struja →</text>
  <!-- 470uF after INA -->
  <line x1="560" y1="510" x2="560" y2="655" stroke="#d93025" stroke-width="2"/>
  <line x1="550" y1="655" x2="570" y2="655" stroke="#202124" stroke-width="3"/>
  <line x1="550" y1="662" x2="570" y2="662" stroke="#202124" stroke-width="3"/>
  <line x1="560" y1="662" x2="560" y2="690" stroke="#444444" stroke-width="2"/>
  <text x="576" y="652" font-size="11" fill="#202124">≥ 470 µF (protiv brownout-a)</text>

  <!-- I2C -->
  <line x1="490" y1="588" x2="620" y2="588" stroke="#9334e6" stroke-width="2.5"/>
  <line x1="490" y1="610" x2="620" y2="610" stroke="#9334e6" stroke-width="2.5"/>

  <!-- GND bus -->
  <line x1="115" y1="532" x2="115" y2="690" stroke="#444444" stroke-width="2.5"/>
  <line x1="115" y1="690" x2="800" y2="690" stroke="#444444" stroke-width="3"/>
  <line x1="395" y1="630" x2="395" y2="690" stroke="#444444" stroke-width="2.5"/>
  <line x1="720" y1="630" x2="720" y2="690" stroke="#444444" stroke-width="2.5"/>
  <text x="400" y="710" font-size="12" fill="#444444" font-weight="bold">GND — ZAJEDNIČKA masa za izvor, INA226 i S3</text>
  <text x="398" y="684" font-size="10" fill="#444444">INA GND</text>
  <text x="723" y="684" font-size="10" fill="#444444">S3 GND</text>

  <text x="30" y="748" font-size="12" fill="#5f6368">Za razvoj (van mjerenja): S3 normalno na USB, INA226 ne treba. Nikad USB + externo 3V3 istovremeno.</text>
  <text x="30" y="766" font-size="12" fill="#5f6368">DevKit V1 (E4): ista logika, pinovi SCK→26, WS→25, SD→33, SDA→21, SCL→22.</text>
</svg>
