<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Mel filteri i PSD intervali"><title>Mel filteri i PSD intervali</title><style>text{font:16px system-ui,sans-serif;fill:#183239}.small{font-size:13px}</style><rect width="760" height="310" rx="12" fill="#eff7f4"/><text x="30" y="30">Mel: preklopljeni filteri, frekvencije dobijaju različite težine</text><polygon points="45,125 95,55 165,125" fill="#087e8b" fill-opacity=".12" stroke="#087e8b" stroke-width="2"/><polygon points="95,125 165,55 270,125" fill="#087e8b" fill-opacity=".12" stroke="#087e8b" stroke-width="2"/><polygon points="165,125 270,55 425,125" fill="#087e8b" fill-opacity=".12" stroke="#087e8b" stroke-width="2"/><polygon points="270,125 425,55 700,125" fill="#087e8b" fill-opacity=".12" stroke="#087e8b" stroke-width="2"/><rect x="45" y="205" width="50" height="50" fill="#bb5e17" fill-opacity=".12" stroke="#bb5e17" stroke-width="2"/><rect x="95" y="205" width="70" height="50" fill="#bb5e17" fill-opacity=".12" stroke="#bb5e17" stroke-width="2"/><rect x="165" y="205" width="105" height="50" fill="#bb5e17" fill-opacity=".12" stroke="#bb5e17" stroke-width="2"/><rect x="270" y="205" width="155" height="50" fill="#bb5e17" fill-opacity=".12" stroke="#bb5e17" stroke-width="2"/><rect x="425" y="205" width="275" height="50" fill="#bb5e17" fill-opacity=".12" stroke="#bb5e17" stroke-width="2"/><text x="30" y="175">Naš PSD: odvojeni intervali, prosjek binova unutar intervala</text><text class="small" x="30" y="290">Šematski prikaz nekoliko traka; nije stvarna skala svih 128 / 96 traka.</text></svg>